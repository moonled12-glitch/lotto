name: Update lotto data

on:
  schedule:
    # 매주 토요일 21:00 KST(12:00 UTC) 추첨 직후 업데이트
    # + 데이터 지연/실행 지연 대비 심야 재시도 (일 00:00, 03:00 KST)
    - cron: "0 12,15,18 * * 6"
    # 최종 보정: 일요일 21:00 KST
    - cron: "0 12 * * 0"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate latest index.html
        run: python generate.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html draws.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update lotto data ($(date -u +%Y-%m-%d))"
            git push
          fi
